<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>ＭＪＲ深川住吉 1307</title>
    <meta name="robots" content="noindex,nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ＭＪＲ深川住吉 1307">
    <meta property="og:description" content="3LDK / 76.86㎡ / 東京メトロ半蔵門線 住吉駅 徒歩15分 / 東京メトロ東西線 東陽町駅 徒歩16分">

    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --sub: #64748b;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --yes: #e11d48;
            --no: #64748b;
            --pad: 16px;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
            font-size: 15px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            /* 下部固定バーぶんの余白（ホームインジケータ考慮） */
            padding-bottom: calc(86px + env(safe-area-inset-bottom));
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
        }

        /* ---------- ヘッダー ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 12px var(--pad);
            padding-top: calc(12px + env(safe-area-inset-top));
            background: rgba(255, 255, 255, .86);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .topbar h1 {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar .rent {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent);
            white-space: nowrap;
        }

        /* ---------- 写真 ---------- */
        .gallery {
            position: relative;
            background: #0f172a;
        }

        .rail {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .rail::-webkit-scrollbar {
            display: none;
        }

        .rail img {
            flex: 0 0 100%;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            scroll-snap-align: center;
            cursor: zoom-in;
            display: block;
        }

        .counter {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 3px 9px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: rgba(15, 23, 42, .66);
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        .tapnote {
            position: absolute;
            left: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            font-size: 11px;
            color: #fff;
            background: rgba(15, 23, 42, .5);
            border-radius: 999px;
            pointer-events: none;
            transition: opacity .4s;
        }

        .tapnote svg {
            width: 12px;
            height: 12px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
        }

        .noimg {
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 13px;
        }

        /* ---------- カード ---------- */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            margin: 12px var(--pad);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 0 0 1px rgba(15, 23, 42, .045);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 15px;
            font-size: 14px;
            font-weight: 700;
        }

        .card-head svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- 初期費用 ---------- */
        .total {
            padding: 13px 15px 15px;
            background: var(--accent-soft);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .total .cap {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            opacity: .85;
        }

        .total .amt {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2px 8px;
            margin-top: 1px;
        }

        .total b {
            font-size: 30px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -.025em;
            line-height: 1.15;
        }

        .total .mult {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            opacity: .8;
        }

        .warn {
            display: flex;
            gap: 6px;
            margin-top: 9px;
            padding: 7px 9px;
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.5;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 7px;
        }

        .warn::before {
            content: "!";
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            margin-top: 1px;
            font-size: 10px;
            line-height: 14px;
            text-align: center;
            color: #fff;
            background: #d97706;
            border-radius: 50%;
        }

        .rows {
            padding: 4px 15px 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .row .k {
            color: var(--sub);
            flex-shrink: 0;
        }

        .row .v {
            font-weight: 650;
            text-align: right;
            word-break: break-word;
        }

        .row .v.tbd {
            color: #b45309;
            font-weight: 600;
        }

        .row .raw {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--sub);
        }

        .note {
            padding: 0 15px 13px;
            font-size: 11.5px;
            color: var(--sub);
            line-height: 1.6;
        }

        /* ---------- 概要（アコーディオン） ---------- */
        details {
            border-top: 1px solid var(--border);
        }

        details:first-of-type {
            border-top: 0;
        }

        summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "";
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--sub);
            border-bottom: 2px solid var(--sub);
            transform: rotate(45deg) translateY(-2px);
            transition: transform .2s;
        }

        details[open] summary::after {
            transform: rotate(-135deg) translateY(-2px);
        }

        /* ---------- 興味あり／なし ---------- */
        .actionbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, .92);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-top: 1px solid var(--border);
        }

        .actionbar .inner {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }

        .act {
            flex: 1;
            min-height: 52px;
            /* 親指で押しやすい高さ */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--sub);
            cursor: pointer;
            transition: transform .08s, background .15s, color .15s, border-color .15s;
        }

        .act svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .act:active {
            transform: scale(.97);
        }

        .act.yes {
            flex: 1.5;
            color: #fff;
            background: var(--yes);
            border-color: var(--yes);
            box-shadow: 0 4px 12px -3px rgba(225, 29, 72, .5);
        }

        .act.yes svg {
            fill: currentColor;
        }

        .act[disabled] {
            opacity: .45;
            cursor: default;
            box-shadow: none;
        }

        .act.chosen {
            outline: 3px solid rgba(37, 99, 235, .25);
        }

        .thanks {
            max-width: 560px;
            margin: 0 auto;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
            font-size: 14.5px;
            font-weight: 700;
            color: #059669;
            background: #ecfdf5;
            border-radius: 12px;
            animation: pop .3s cubic-bezier(.2, 1.3, .4, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.94);
                opacity: 0;
            }
        }

        /* ---------- ライトボックス ---------- */
        .lb {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: none;
            flex-direction: column;
        }

        .lb.open {
            display: flex;
            animation: fade .2s;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }
        }

        .lb-rail {
            flex: 1;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .lb-rail::-webkit-scrollbar {
            display: none;
        }

        .lb-cell {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ピンチズームを許可 */
            overflow: auto;
            touch-action: pinch-zoom pan-x pan-y;
        }

        .lb-cell img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .lb-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .lb-close {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .lb-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 12px 0 calc(14px + env(safe-area-inset-bottom));
        }

        .lb-dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .32);
            transition: background .2s, transform .2s;
        }

        .lb-dots i.on {
            background: #fff;
            transform: scale(1.35);
        }

        /* 大画面では2カラムに */
        @media (min-width: 720px) {
            .wrap {
                max-width: 960px;
            }

            .cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }

            /* 広い画面で写真が縦に伸びすぎないように抑える */
            .rail img {
                aspect-ratio: auto;
                height: 52vh;
            }
        }
    </style>
</head>

<body>

    <script>

        window.PROPERTY_DATA = {"title": "ＭＪＲ深川住吉 1307", "images": ["https://property-images.itandi.co.jp/public/images/01M0K6E8ABD1GGSDF2BJFVEA6Q.jpg", "https://property-images.itandi.co.jp/public/images/01M0K6E7ZVXY68C0ZRZ6NFTHQ7.jpg", "https://property-images.itandi.co.jp/public/images/01M0K6E85A3TS52GB6JTCASCCR.jpg"], "details": [{"label": "基本情報", "value": [{"label": "賃料", "value": "27.8万円"}, {"label": "共益費", "value": "20,000円"}, {"label": "敷金", "value": "27.8万円"}, {"label": "礼金", "value": "27.8万円"}, {"label": "所在地", "value": "東京都江東区千石１丁目9-31 を見る 現地周辺を見る"}, {"label": "交通", "value": "東京メトロ半蔵門線 住吉駅 徒歩15分 / 東京メトロ東西線 東陽町駅 徒歩16分"}, {"label": "間取り", "value": "3LDK"}, {"label": "専有面積", "value": "76.86㎡"}, {"label": "所在階", "value": "13階"}, {"label": "階建", "value": "14階建"}, {"label": "建物種別", "value": "マンション"}, {"label": "主要採光面", "value": "南向き"}, {"label": "現況", "value": "賃貸中"}]}, {"label": "費用", "value": [{"label": "保険", "value": "2年間 16,550円"}, {"label": "保証情報", "value": "利用必須"}, {"label": "清掃費", "value": "118364円 退去時固定"}]}, {"label": "建物情報", "value": [{"label": "築年数", "value": "2024年1月(築2年)"}, {"label": "構造", "value": "鉄筋コンクリート"}, {"label": "総戸数", "value": "165戸"}]}, {"label": "契約条件", "value": [{"label": "入居可能時期", "value": "2026年9月下旬"}, {"label": "取引態様", "value": "貸主"}, {"label": "賃貸借契約区分", "value": "定期借家"}, {"label": "賃貸借契約期間", "value": "2028年7月まで"}, {"label": "備考", "value": "レジデンシャルパートナーズ 保証料：賃料等の50％(最低2万)、月額保証・事務手数料：賃料等の1％(更新料無)"}]}]};
        window.INTEREST_ENDPOINT = "https://script.google.com/macros/s/AKfycbz83vj7zvFAnCSe-eaM9RNtUlyRssLrky6YTl7Dj4pDSkcstNVyX8Qtd2NuNkiEM88/exec";

    <script>
/* =========================================================================
 *  物件アウトプットページ
 *  拡張機能が送る JSON をそのまま受け取って描画する
 *    { title, images: [url], details: [{ label, value: [{label, value}] }] }
 * ========================================================================= */
(() => {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const QS = new URLSearchParams(location.search);

    /* ---------------------------------------------------------------------
     *  データ取得（未設定ならデモデータで描画する）
     * ------------------------------------------------------------------- */
    const DEMO = {
        title: "サンプルレジデンス代々木 302",
        images: [],
        details: [
            {
                label: "基本情報", value: [
                    { label: "賃料", value: "12.50万円" },
                    { label: "管理費・共益費", value: "8,000円" },
                    { label: "敷金", value: "1ヶ月" },
                    { label: "礼金", value: "1ヶ月" },
                    { label: "間取り", value: "1LDK" },
                    { label: "専有面積", value: "42.35m²" },
                    { label: "所在階", value: "3階 / 8階建" },
                    { label: "交通", value: "JR山手線 代々木駅 徒歩6分" },
                    { label: "所在地", value: "東京都渋谷区代々木1-2-3" }
                ]
            },
            {
                label: "費用", value: [
                    { label: "仲介手数料", value: "1ヶ月＋税" },
                    { label: "火災保険料", value: "20,000円" },
                    { label: "保証会社利用料", value: "賃料の50%" },
                    { label: "鍵交換費", value: "22,000円" },
                    { label: "室内消毒", value: "実費" }
                ]
            },
            {
                label: "建物情報", value: [
                    { label: "築年月", value: "2018年3月" },
                    { label: "構造", value: "RC造" },
                    { label: "設備", value: "エアコン オートロック 宅配ボックス 独立洗面台 追焚 TVモニタ付インターホン" }
                ]
            },
            {
                label: "契約条件", value: [
                    { label: "契約期間", value: "2年" },
                    { label: "更新料", value: "新賃料1ヶ月" },
                    { label: "入居時期", value: "即入居可" }
                ]
            }
        ]
    };

    const DATA = window.PROPERTY_DATA || DEMO;

    // 顧客に見せないセクション。
    // 「その他」には取扱会社名・電話番号など元付情報が入るため、顧客ページには出さない
    // （初期費用の計算には引き続き使うので、データ自体は捨てない）。
    const HIDDEN_SECTIONS = ["元付情報", "その他"];
    const IS_DEMO = !window.PROPERTY_DATA;

    /* ---------------------------------------------------------------------
     *  ユーティリティ
     * ------------------------------------------------------------------- */
    // 全角英数を半角に寄せる（ATBBは表記ゆれが多い）
    const normalize = (s) => String(s == null ? "" : s)
        .replace(/[０-９Ａ-Ｚａ-ｚ％．，］［]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/，/g, ",");

    const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");

    // details を平坦化して label で引けるようにする
    const FLAT = [];
    (DATA.details || []).forEach((sec) => {
        if (Array.isArray(sec.value)) {
            sec.value.forEach((r) => FLAT.push({
                section: sec.label,
                label: normalize(r.label).replace(/\s/g, ""),
                value: normalize(r.value).trim()
            }));
        }
    });
    const pick = (re) => FLAT.find((r) => re.test(r.label));

    /**
     * ATBBの費用表記を円に変換する。
     *  「1ヶ月」「賃料の50%」「10万円」「8,000円」「無」「実費」… に対応。
     *  月数・％は monthlyBase（賃料）を基準に計算する。
     *  金額として確定できない場合は null（＝要確認）を返す。
     */
    const toYen = (raw, monthlyBase) => {
        if (!raw) return null;
        let s = normalize(raw).replace(/[,\s円]/g, "");
        if (!s) return null;
        if (/^(無|なし|無し|不要|-|―|ー|ｰ|0)$/.test(s)) return 0;
        if (/(実費|別途|要相談|応相談|要確認)/.test(s)) return null;

        const taxed = /(税別|＋税|\+税|税抜)/.test(s) ? 1.1 : 1;

        // 月数指定（例: 1ヶ月 / 1.5ケ月 / 賃料の2か月）
        let m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*[ヶケカかヵ箇]?月/);
        if (m) return monthlyBase ? Math.round(parseFloat(m[1]) * monthlyBase * taxed) : null;

        // 割合指定（例: 賃料の50%）
        m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*[%%]/);
        if (m) return monthlyBase ? Math.round(monthlyBase * parseFloat(m[1]) / 100 * taxed) : null;

        // 万円
        m = s.match(/([0-9]+(?:\.[0-9]+)?)万/);
        if (m) return Math.round(parseFloat(m[1]) * 10000 * taxed);

        // 素の数値（円）
        m = s.match(/^([0-9]+(?:\.[0-9]+)?)$/);
        if (m) return Math.round(parseFloat(m[1]) * taxed);

        // 「20,000円 / 2年」のように金額と条件が混在する場合、先頭の金額を採る
        m = normalize(raw).replace(/[,\s]/g, "").match(/([0-9]+(?:\.[0-9]+)?)(万?)円/);
        if (m) return Math.round(parseFloat(m[1]) * (m[2] ? 10000 : 1) * taxed);

        return null;
    };

    /* ---------------------------------------------------------------------
     *  ヘッダー
     * ------------------------------------------------------------------- */
    const rentRow = pick(/^賃料$/) || pick(/^賃料/);
    const rentYen = toYen(rentRow && rentRow.value, null);

    // ATBBは「管理費・共益費」で1項目、イタンジは「管理費」「共益費」が別項目。
    // 両方を足す（同名ラベルの重複は除く）。
    const seenKanri = new Set();
    const kanriRows = FLAT.filter((r) => {
        if (!/(管理費|共益費)/.test(r.label) || seenKanri.has(r.label)) return false;
        seenKanri.add(r.label);
        return true;
    });
    const kanriYen = kanriRows.reduce((sum, r) => sum + (toYen(r.value, null) || 0), 0);
    const kanriRow = kanriRows[0];

    document.title = DATA.title || "物件詳細";
    $("ttl").textContent = DATA.title || "物件詳細";
    if (rentYen) $("rentBadge").textContent = (rentYen / 10000).toFixed(1).replace(/\.0$/, "") + "万円";

    /* ---------------------------------------------------------------------
     *  写真（タップで拡大）
     * ------------------------------------------------------------------- */
    const IMAGES = (DATA.images || []).filter(Boolean);
    const gallery = $("gallery");

    if (IMAGES.length) {
        const rail = document.createElement("div");
        rail.className = "rail";
        IMAGES.forEach((src, i) => {
            const img = new Image();
            img.src = src;
            img.alt = `写真 ${i + 1}`;
            img.loading = i < 2 ? "eager" : "lazy";
            img.decoding = "async";
            img.addEventListener("click", () => openLightbox(i));
            rail.appendChild(img);
        });

        const counter = document.createElement("div");
        counter.className = "counter";
        counter.textContent = `1 / ${IMAGES.length}`;

        const tapnote = document.createElement("div");
        tapnote.className = "tapnote";
        tapnote.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8.5v5M8.5 11h5"/></svg>タップで拡大';

        gallery.append(rail, counter, tapnote);

        rail.addEventListener("scroll", () => {
            const i = Math.round(rail.scrollLeft / rail.clientWidth);
            counter.textContent = `${Math.min(i + 1, IMAGES.length)} / ${IMAGES.length}`;
            tapnote.style.opacity = "0";
        }, { passive: true });
        setTimeout(() => { tapnote.style.opacity = "0"; }, 4000);
    } else {
        gallery.innerHTML = '<div class="noimg">写真は準備中です</div>';
    }

    /* ---------- ライトボックス ---------- */
    const lb = $("lb"), lbRail = $("lbRail"), lbDots = $("lbDots"), lbCount = $("lbCount");

    if (IMAGES.length) {
        IMAGES.forEach((src, i) => {
            const cell = document.createElement("div");
            cell.className = "lb-cell";
            const img = new Image();
            img.dataset.src = src;             // 開いた時に読み込む
            img.alt = `写真 ${i + 1}`;
            cell.appendChild(img);
            lbRail.appendChild(cell);

            const dot = document.createElement("i");
            lbDots.appendChild(dot);
        });
    }

    function openLightbox(index) {
        // 表示中の前後だけ先に読み込む
        lbRail.querySelectorAll("img").forEach((img, i) => {
            if (Math.abs(i - index) <= 1 && !img.src) img.src = img.dataset.src;
        });
        lb.classList.add("open");
        document.body.style.overflow = "hidden";
        // レイアウト確定後にスクロール位置を合わせる
        requestAnimationFrame(() => {
            lbRail.scrollLeft = index * lbRail.clientWidth;
            syncLightbox();
        });
    }

    function closeLightbox() {
        lb.classList.remove("open");
        document.body.style.overflow = "";
    }

    function syncLightbox() {
        const i = Math.round(lbRail.scrollLeft / lbRail.clientWidth);
        lbCount.textContent = `${i + 1} / ${IMAGES.length}`;
        lbDots.querySelectorAll("i").forEach((d, j) => d.classList.toggle("on", j === i));
        lbRail.querySelectorAll("img").forEach((img, j) => {
            if (Math.abs(j - i) <= 1 && !img.src) img.src = img.dataset.src;
        });
    }

    lbRail.addEventListener("scroll", syncLightbox, { passive: true });
    $("lbClose").addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

    /* ---------------------------------------------------------------------
     *  初期費用
     * ------------------------------------------------------------------- */
    const COST_SPEC = [
        { name: "敷金", re: /^(敷金|保証金)/ },
        { name: "礼金", re: /^(礼金|権利金)/ },
        { name: "前家賃（1ヶ月）", fixed: rentYen, raw: rentRow && rentRow.value },
        { name: "管理費・共益費（1ヶ月）", fixed: kanriYen,
          // 管理費と共益費が別項目のときは両方の元表記を並べる
          raw: kanriRows.length > 1
              ? kanriRows.map((r) => r.label + " " + r.value).join(" ／ ")
              : (kanriRow && kanriRow.value) },
        { name: "仲介手数料", re: /(仲介手数料|媒介報酬)/ },
        { name: "保証会社利用料", re: /(保証会社|家賃保証|保証料)/ },
        { name: "火災保険料", re: /保険/ },
        { name: "24時間サポート", re: /(24時間|２４時間|安心サポート)/ },
        { name: "鍵交換費", re: /(鍵交換|シリンダー)/ },
        { name: "室内消毒・抗菌", re: /(消毒|抗菌|クリーニング代)/ }
    ];

    // 月額基準＝賃料＋管理費（保証会社料などは総支払額基準のことが多い）
    const MONTHLY = (rentYen || 0) + kanriYen;
    const rows = [];
    let total = 0, unknown = 0;

    COST_SPEC.forEach((spec) => {
        let amount, raw;

        if (spec.fixed !== undefined) {
            amount = spec.fixed;
            raw = spec.raw;
            if (!amount) return;                      // 賃料/管理費が取れなければ出さない
        } else {
            const hit = pick(spec.re);
            if (!hit) return;                          // 項目自体が無ければ出さない
            raw = hit.value;
            const base = /保証会社|家賃保証|保証料/.test(spec.name) ? MONTHLY : rentYen;
            amount = toYen(raw, base);
        }

        if (amount === 0) {
            rows.push({ name: spec.name, text: "なし", amount: 0 });
        } else if (amount === null) {
            rows.push({ name: spec.name, text: raw || "要確認", tbd: true });
            unknown++;
        } else {
            rows.push({ name: spec.name, text: yen(amount), raw: raw, amount: amount });
            total += amount;
        }
    });

    // ★イタンジ/ATBBのデータには仲介手数料が載っていない（業者間サイトのため）。
    //   黙って合計から落とすと、顧客には実額より数十万安く見える。必ず明示する。
    // ----------------------------------------------------------------
    //  掲載データに無い費用を自社の規定料率で補う
    //  ★イタンジ/ATBBは業者間サイトのため、顧客に請求する仲介手数料が載っていない。
    //    黙って合計から落とすと実額より数十万安く見えるので、規定料率で補う。
    //    料率を変えるときはこの2行だけ直せばよい。
    // ----------------------------------------------------------------
    const RATE_CHUKAI = 1.1;   // 仲介手数料 = 賃料の1.1ヶ月（1ヶ月＋税）
    const RATE_HOSHO = 0.5;    // 保証会社初回保証料 = 賃料＋管理費の0.5ヶ月

    const has = (re) => rows.some((r) => re.test(r.name));
    const estimated = [];

    if (!has(/仲介手数料/)) {
        if (rentYen) {
            const v = Math.round(rentYen * RATE_CHUKAI);
            rows.push({ name: "仲介手数料", text: yen(v), raw: "賃料の1.1ヶ月（税込）", amount: v });
            total += v;
            estimated.push("仲介手数料");
        } else {
            rows.push({ name: "仲介手数料", text: "別途", tbd: true });
            unknown++;
        }
    }

    const hoshoRow = pick(/(保証会社|家賃保証|保証情報)/);
    if (!has(/保証会社/)) {
        if (MONTHLY) {
            const v = Math.round(MONTHLY * RATE_HOSHO);
            rows.push({
                name: "保証会社初回保証料", text: yen(v),
                raw: "賃料等の50%" + (hoshoRow ? "／" + hoshoRow.value.split("\n")[0] : ""),
                amount: v
            });
            total += v;
            estimated.push("保証会社初回保証料");
        } else if (hoshoRow) {
            rows.push({ name: "保証会社初回保証料", text: "別途", raw: hoshoRow.value, tbd: true });
            unknown++;
        }
    }

    const costRows = $("costRows");
    rows.forEach((r) => {
        const div = document.createElement("div");
        div.className = "row";
        const k = document.createElement("div");
        k.className = "k";
        k.textContent = r.name;
        const v = document.createElement("div");
        v.className = "v" + (r.tbd ? " tbd" : "");
        v.textContent = r.text;
        // 「1ヶ月」など元の表記も小さく残す
        if (r.raw && !/^[0-9,]+$/.test(r.raw) && r.text !== r.raw) {
            const s = document.createElement("span");
            s.className = "raw";
            s.textContent = r.raw;
            v.appendChild(s);
        }
        div.append(k, v);
        costRows.appendChild(div);
    });

    if (total > 0) {
        $("totalYen").textContent = yen(total);
        if (rentYen) $("totalMult").textContent = "賃料の約" + (total / rentYen).toFixed(1) + "ヶ月ぶん";
    } else {
        $("totalYen").textContent = "要確認";
    }

    // 別途費用があるときは合計の直下で警告する（見落とすと実額と大きく乖離する）
    const tbdNames = rows.filter((r) => r.tbd).map((r) => r.name);
    if (tbdNames.length) {
        const warn = document.createElement("div");
        warn.className = "warn";
        warn.textContent = "この金額に " + tbdNames.join("・") + " は含まれていません";
        $("totalYen").closest(".total").appendChild(warn);
    }

    const notes = ["表示は掲載情報からの概算です。実際の金額は契約条件・入居日により変動します。"];
    if (estimated.length) {
        notes.unshift(estimated.join("・") + "は当社規定の料率による概算です。");
    }
    if (unknown) notes.unshift(`「要確認」の${unknown}項目は金額が確定していないため合計に含んでいません。`);
    if (!rows.length) notes.length = 0, notes.push("費用情報を取得できませんでした。");
    $("costNote").textContent = notes.join(" ");

    /* ---------------------------------------------------------------------
     *  物件概要（アコーディオン）
     * ------------------------------------------------------------------- */
    const specCard = $("specCard");
    let rendered = 0;
    (DATA.details || []).forEach((sec) => {
        if (!Array.isArray(sec.value) || !sec.value.length) return;
        if (HIDDEN_SECTIONS.includes(String(sec.label).trim())) return;
        const d = document.createElement("details");
        if (rendered === 0) d.open = true;             // 先頭（基本情報）だけ最初から開く
        rendered++;

        const sum = document.createElement("summary");
        sum.textContent = sec.label;
        d.appendChild(sum);

        const box = document.createElement("div");
        box.className = "rows";
        sec.value.forEach((r) => {
            const label = normalize(r.label).trim();
            const value = normalize(r.value).trim();
            if (!label || !value) return;
            const row = document.createElement("div");
            row.className = "row";
            const k = document.createElement("div");
            k.className = "k";
            k.textContent = label;
            const v = document.createElement("div");
            v.className = "v";
            v.textContent = value;
            row.append(k, v);
            box.appendChild(row);
        });
        d.appendChild(box);
        specCard.appendChild(d);
    });

    /* ---------------------------------------------------------------------
     *  興味あり／なし
     * ------------------------------------------------------------------- */
    const ENDPOINT = window.INTEREST_ENDPOINT || "";
    const CUSTOMER = QS.get("c") || "guest";
    const PAGE_ID = QS.get("id") || location.pathname.split("/").filter(Boolean).pop() || "atbb";
    const STORE_KEY = `interest:${PAGE_ID}:${CUSTOMER}`;

    const btnYes = $("btnYes"), btnNo = $("btnNo"), actions = $("actions"), thanks = $("thanks");

    const showThanks = (choice) => {
        actions.style.display = "none";
        thanks.style.display = "flex";
        thanks.textContent = choice === "yes"
            ? "✓ 「興味あり」を担当者にお伝えしました"
            : "✓ ご回答ありがとうございました";
        if (choice === "no") {
            thanks.style.color = "#64748b";
            thanks.style.background = "#f1f5f9";
        }
    };

    const send = (choice) => {
        // 二度押し・戻るボタン対策
        try { localStorage.setItem(STORE_KEY, choice); } catch (_) { }
        showThanks(choice);                            // 通信を待たせない

        if (!ENDPOINT) return;
        const q = new URLSearchParams({
            action: "interest",
            choice: choice,                            // yes / no
            // ★顧客IDのキーは cid。'c' は Google Apps Script の予約パラメータで、
            //   数値以外を渡すとスクリプトに届く前に HTTP 400 で弾かれる。
            cid: CUSTOMER,
            building: DATA.title || "",
            room: "",
            rent: String(MONTHLY || rentYen || ""),
            plan: (pick(/間取/) || {}).value || "",
            page: PAGE_ID
        });
        // GET のみ＝CORSプリフライトが発生しない（既存GASの doGet と同じ方式）
        fetch(`${ENDPOINT}?${q}`, { mode: "no-cors", keepalive: true })
            .catch((e) => console.warn("[interest] 送信失敗:", e));
    };

    try {
        const prev = localStorage.getItem(STORE_KEY);
        if (prev) showThanks(prev);
    } catch (_) { }

    btnYes.addEventListener("click", () => send("yes"));
    btnNo.addEventListener("click", () => send("no"));

    if (IS_DEMO) console.info("[output-page] PROPERTY_DATA 未設定のためデモデータで表示しています");
})();

    </script>
</body>

</html>
